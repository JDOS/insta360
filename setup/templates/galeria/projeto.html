<!DOCTYPE html>

<head>

   <title>INSTA 360º</title>

    <style>
   
    </style>
</head>

<body>

        <div class="cards-section d-flex flex-row flex-wrap justify-content-center gap-3" id="cards">
                      
                {%for fotografia in fotografias %}
                    <div class="card" style="width: 18rem;">
                        <img src="{{fotografia.foto.url}}" class="card-img-top" alt="...">
                            <div class="card-body">
                                <h5 class="card-title">{{fotografia.categoria}}</h5>
                                <p class="card-text">{{fotografia.nome}}</p>
                                <a href="{% url 'imagem360' fotografia.id %}" class="btn btn-primary">Visualizar</a>
                                <a href="{% url 'imagem360Animacao' fotografia.id %}" class="btn btn-primary">Animacao</a>
                            </div>
                    </div>
                {% endfor %}


        </div>  

</body>
</html>
