{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>View 360º</title>
    <meta charset="utf-8">
    <!-- for optimal display on high DPI devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
</head>

<style type="text/css">
    body{
            margin: 0px;
    }

</style>
  <body>
<!-- the viewer container must have a defined size -->
<div id="viewer" style="width: 100vw; height: 100vh;"></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
            "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js"
        }
    }
</script>

<script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';

    const viewer = new Viewer({

    navbar: [
        'zoom',
	'move',
	'download',
	'caption',
        'fullscreen',
    ],
	caption:'<b>&copy; ITTI</b>',
        container: document.querySelector('#viewer'),
	    panorama: "{{ fotografia.foto.url }}",
        defaultZoomLvl: 0,
        minFov: 5,
        defaultYaw: '{{defaultYaw}}',        // Ajuste horizontal (em radianos ou graus)
        defaultPitch: '{{defaultPitch}}',      // Ajuste vertical (em radianos ou graus)
        sphereCorrection: {   // Correção da esfera para imagens tortas
            pan: '{{pan}}',           // Rotação horizontal (ajuste conforme necessário)
            tilt: '{{tilt}}',          // Inclinação vertical (ajuste conforme necessário)
            roll: '{{roll}}'           // Rotação no eixo Z (ajuste conforme necessário)
        }
    });

    
</script>

  </body>
</html>
