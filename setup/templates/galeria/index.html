{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

	  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-DQvkBjpPgn7RC31MCQoOeC9TI2kdqa4+BSgNMNj8v77fdC77Kj5zpWFTJaaAoMbC" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.min.js" integrity="sha384-Re460s1NeyAhufAM5JwfIGWosokaQ7CH15ti6W5Y4wC/m4eJ5opJ2ivohxVM05Wd" crossorigin="anonymous"></script>    
      <link rel="stylesheet" href="{% static '/styles/styles.css' %}">

   <title>INSTA 360º</title>

    <style>
   
    </style>
</head>

<body>
    <div class="background"></div>

    <div class="content">
        <h1>Bem-vindo!</h1>
	    <h2>INSTA 360</h2>
        <p>Faça seu Tour!</p>

        <div class="arrow" onclick="scrollToCards()">⬇</div>
    </div>

        <div class="cards-section d-flex flex-row flex-wrap justify-content-center gap-3" id="cards">
                      
                {%for categoria in categorias %}
                    <div class="card" style="width: 18rem;">
                        {% if categoria.foto %}
                        <img src="{{categoria.foto.url}}" class="card-img-top" alt="...">
                        {% endif %}
                            <div class="card-body">
                                <h5 class="card-title">{{categoria.nome|title}}</h5>
                                  <p class="card-text">{{categoria.descricao}}</p>
                                  <a href="{% url 'projeto' categoria.id %}" class="btn btn-primary">Visualizar</a>
                            </div>
                    </div>
                {% endfor %}


        </div>  

</body>
</html>
