{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour 360 - {{ album.title }}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin@5/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body { margin: 0; }
    #viewer { width: 100vw; height: 100vh; }

    /* ----- Aviso do teclado ----- */
    .aviso-teclado {
      position: fixed;
      bottom: 280px;   /* 70 (base do minimapa) + 200 (altura) + 10 de folga */
      left: 16px;      /* alinhado com o minimapa */
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      border-radius: 10px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      transition: opacity 0.6s;
      width: fit-content;   /* não estica além do texto */
    }
    .aviso-teclado kbd {
      display: inline-block;
      padding: 2px 7px;
      background: #fff;
      color: #222;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9em;
      font-weight: 600;
    }
    .aviso-teclado.sumindo { opacity: 0; }

    /* ----- Minimapa ----- */
    #minimapa {
      position: fixed;
      bottom: 70px;
      left: 16px;
      width: 280px;
      height: 200px;
      z-index: 95;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: width 0.25s, height 0.25s;
    }
    #minimapa.grande { width: 460px; height: 340px; }

    #btn-minimapa {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 500;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .aviso-teclado { display: none; }
      #minimapa { width: 150px; height: 110px; bottom: 60px; left: 10px; }
      #minimapa.grande { width: calc(100% - 20px); height: 50vh; }
    }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <div class="aviso-teclado" id="aviso-teclado">
    <kbd>↑</kbd> avançar <kbd>↓</kbd> voltar
  </div>

  {% if tem_mapa %}
    <div id="minimapa">
      <button id="btn-minimapa" title="Ampliar/reduzir">⤢</button>
    </div>
  {% endif %}

  {# Dados passados com segurança para o JavaScript (aspas e apóstrofos não quebram o script) #}
  {{ dados_fotos|json_script:"dados-fotos" }}
  {{ album.title|json_script:"titulo-album" }}

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin@5/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5/index.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    {% if inverterSentidoStreetView %}
      const sentido_frente = {{ defaultYawInteger }};
      const sentido_voltar = parseInt({{ defaultYawInteger }}, 10) * -1;
    {% else %}
      const sentido_frente = parseInt({{ defaultYawInteger }}, 10) * -1;
      const sentido_voltar = parseInt({{ defaultYawInteger }}, 10);
    {% endif %}

    // ----- Dados das fotos (mesma ordem dos nós do tour) -----
    const fotos = JSON.parse(document.getElementById('dados-fotos').textContent);
    const tituloAlbum = JSON.parse(document.getElementById('titulo-album').textContent);
    const correcao = { pan: '{{ pan }}', tilt: '{{ tilt }}', roll: '{{ roll }}' };

    //descrição foto
    function legenda(f) {
      const texto = tituloAlbum + ':Foto-' + f.nome;
      if (f.lat == null || f.lon == null) {
        return texto + ' (sem localização)';
      }
      return texto + ' (' + f.lat.toFixed(6) + ', ' + f.lon.toFixed(6) + ')';
    }
    // ----- Nós do tour: cada foto liga à próxima e à anterior -----
    const nodes = fotos.map((f, i) => {
      const n = i + 1;
      const links = [];
      if (n < fotos.length) {
        links.push({ nodeId: 'node-' + (n + 1), position: { yaw: sentido_frente, pitch: 0 } });
      }
      if (n > 1) {
        links.push({ nodeId: 'node-' + (n - 1), position: { yaw: sentido_voltar, pitch: 0 } });
      }
      return {
        id: 'node-' + n,
        panorama: f.url,
        caption: legenda(f),
        sphereCorrection: correcao,
        links: links,
      };
    });

    // Zoom escolhido pelo usuário; é mantido ao trocar de foto
    let zoomGuardado = 0;

    const viewer = new PhotoSphereViewer.Viewer({
      container: document.getElementById('viewer'),
      loadingImg: 'https://photo-sphere-viewer-data.netlify.app/assets/loader.gif',
      touchmoveTwoFingers: true,
      mousewheelCtrlKey: false,
      defaultZoomLvl: 0,
      defaultYaw: '30deg',
      navbar: 'zoom move gallery caption fullscreen',
      keyboard: 'always',
      keyboardActions: {
        ArrowLeft: 'ROTATE_LEFT',
        ArrowRight: 'ROTATE_RIGHT',
        PageUp: 'ZOOM_IN',
        PageDown: 'ZOOM_OUT',
      },
      plugins: [
        [PhotoSphereViewer.MarkersPlugin],
        [PhotoSphereViewer.GalleryPlugin, { thumbnailSize: { width: 100, height: 100 } }],
        [PhotoSphereViewer.VirtualTourPlugin, {
          positionMode: 'manual',
          renderMode: '3d',
          nodes: nodes,
          startNodeId: 'node-{{ start_node }}',
          // Mantém o zoom atual durante a transição entre fotos
          transitionOptions: () => ({
            showLoader: true,
            effect: 'fade',
            rotation: true,
            zoomTo: zoomGuardado,
          }),
        }],
      ],
    });

    // ----- Controle do zoom -----
    viewer.addEventListener('zoom-updated', e => {
      zoomGuardado = e.zoomLevel;
    });

    // ----- Navegação pelo teclado -----
    const tour = viewer.getPlugin(PhotoSphereViewer.VirtualTourPlugin);
    const totalNodes = fotos.length;
    let nodeAtual = {{ start_node }};

    tour.addEventListener('node-changed', e => {
      nodeAtual = parseInt(e.node.id.replace('node-', ''), 10);

      // Garantia: se a transição alterou o zoom, volta para o que o usuário usava
      const zoomDesejado = zoomGuardado;
      if (Math.abs(viewer.getZoomLevel() - zoomDesejado) > 0.5) {
        viewer.zoom(zoomDesejado);
      }
    });

    function irParaNode(n) {
      if (n >= 1 && n <= totalNodes) {
        tour.setCurrentNode('node-' + n);
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        irParaNode(nodeAtual + 1);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        irParaNode(nodeAtual - 1);
      }
    });

    // Esconde o aviso após 6 segundos
    const aviso = document.getElementById("aviso-teclado");
    setTimeout(() => {
      aviso.classList.add("sumindo");
      setTimeout(() => aviso.remove(), 700);
    }, 6000);

    // ----- Minimapa -----
    {% if tem_mapa %}
    (function () {
      const caixa = document.getElementById("minimapa");

      const mini = L.map(caixa, {
        zoomControl: false, attributionControl: false,
        dragging: false, scrollWheelZoom: false, doubleClickZoom: false
      });

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, referrerPolicy: "strict-origin-when-cross-origin"
      }).addTo(mini);

      // Só as fotos com GPS entram no desenho, mas cada uma guarda seu número de nó
      const comGps = fotos
        .map((f, i) => ({ lat: f.lat, lon: f.lon, node: i + 1 }))
        .filter(f => f.lat != null && f.lon != null);

      const limites = L.latLngBounds(comGps.map(f => [f.lat, f.lon]));

      comGps.forEach(f => {
        L.circleMarker([f.lat, f.lon], {
          radius: 3, color: "#1d70b8", weight: 1,
          fillColor: "#1d70b8", fillOpacity: 0.7
        }).on("click", () => irParaNode(f.node)).addTo(mini);
      });

      // Marcador da foto atual (criado por último para ficar por cima)
      const atual = L.circleMarker([comGps[0].lat, comGps[0].lon], {
        radius: 7, color: "#fff", weight: 3, fillColor: "#e63946", fillOpacity: 1
      }).addTo(mini);

      if (comGps.length > 1) {
        mini.fitBounds(limites, { padding: [10, 10] });
      } else {
        mini.setView([comGps[0].lat, comGps[0].lon], 17);
      }

      function marcarPosicao(n) {
        const f = fotos[n - 1];
        if (!f || f.lat == null || f.lon == null) {
          // Foto sem GPS: esconde o marcador em vez de mostrar um lugar errado
          atual.setStyle({ opacity: 0, fillOpacity: 0 });
          return;
        }
        const p = L.latLng(f.lat, f.lon);
        atual.setStyle({ opacity: 1, fillOpacity: 1 });
        atual.setLatLng(p);
        if (!mini.getBounds().pad(-0.15).contains(p)) mini.panTo(p);
      }

      marcarPosicao(nodeAtual);

      tour.addEventListener("node-changed", e => {
        marcarPosicao(parseInt(e.node.id.replace("node-", ""), 10));
      });

      document.getElementById("btn-minimapa").addEventListener("click", ev => {
        ev.stopPropagation();
        caixa.classList.toggle("grande");
        const aberto = caixa.classList.contains("grande");
        mini.dragging[aberto ? "enable" : "disable"]();
        mini.scrollWheelZoom[aberto ? "enable" : "disable"]();
        setTimeout(() => mini.invalidateSize(), 260);
      });
    })();
    {% endif %}
  </script>
</body>
</html>
